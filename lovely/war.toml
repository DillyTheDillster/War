[manifest]
version = "1.0.0"
dump_lua = false
priority = 0

# When War deck-selecting, replace the Continue tab with Challenges.
# The first G.STAGE==MAIN_MENU branch is the Continue tab; wrapping it means
# when WAR._deck_selecting the expression short-circuits to the `or {Challenges}` branch.
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = "G.STAGE == G.STAGES.MAIN_MENU and {"
position     = "at"
match_indent = true
payload      = "(not (WAR and WAR._deck_selecting)) and G.STAGE == G.STAGES.MAIN_MENU and {"
times        = 1

# The second G.STAGE==MAIN_MENU branch is the original Challenges tab.
# When deck-selecting, make it nil so the duplicate Challenges tab doesn't appear.
# (The slot above already shows Challenges via the Continue→Challenges fall-through.)
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = "G.STAGE == G.STAGES.MAIN_MENU and {"
position     = "at"
match_indent = true
payload      = "(not (WAR and WAR._deck_selecting)) and G.STAGE == G.STAGES.MAIN_MENU and {"
times        = 1

# A rival round is played on a real vanilla boss, so the boss must never decide
# the round: end_round()'s game-over branch is suppressed while one is live.
[[patches]]
[patches.pattern]
target       = "functions/state_events.lua"
pattern      = "local game_over = true"
position     = "after"
match_indent = true
payload      = "if WAR and WAR.GAME and WAR.GAME.active then game_over = false end"
times        = 1

# ...and vanilla must never declare the run won on a rival round either.
[[patches]]
[patches.pattern]
target       = "functions/state_events.lua"
pattern      = "if game_over then"
position     = "before"
match_indent = true
payload      = "if WAR and WAR.GAME and WAR.GAME.pvp_round() then game_won = nil; G.GAME.won = nil end"
times        = 1

# The blind reward on a rival round is always earned — the race against the
# opponent decides the round, not the boss's own chip requirement.
[[patches]]
[patches.pattern]
target       = "functions/state_events.lua"
pattern      = '''if G.GAME.chips - G.GAME.blind.chips >= 0 then
        add_round_eval_row({dollars = G.GAME.blind.dollars, name='blind1', pitch = pitch})'''
position     = "at"
match_indent = true
payload      = '''if G.GAME.chips - G.GAME.blind.chips >= 0 or (WAR and WAR.GAME and WAR.GAME.pvp_round()) then
        add_round_eval_row({dollars = G.GAME.blind.dollars, name='blind1', pitch = pitch})'''
times        = 1

# Extra hand gold is suppressed during a rival round — the round ends on the
# server's signal, not by beating the chip target, so hands remaining after
# the race should not award idle-hand money to one player but not the other.
[[patches]]
[patches.pattern]
target       = "functions/state_events.lua"
pattern      = "if G.GAME.current_round.hands_left > 0 and not G.GAME.modifiers.no_extra_hand_money then"
position     = "at"
match_indent = true
payload      = "if G.GAME.current_round.hands_left > 0 and (not G.GAME.modifiers.no_extra_hand_money) and not (WAR and WAR.GAME and WAR.GAME.pvp_round()) then"
times        = 1

# Injected before the 'hands' handler so it lands in the same elseif chain.
[[patches]]
[patches.pattern]
target       = "functions/common_events.lua"
pattern      = "elseif config.name == 'hands' then"
position     = "before"
match_indent = true
payload      = '''elseif config.name == 'war_comeback' then
                    table.insert(left_text, {n=G.UIT.T, config={text=config.disp or config.dollars, scale=0.8*scale, colour=G.C.PURPLE, shadow=true, juice=true}})
                    table.insert(left_text, {n=G.UIT.O, config={object=DynaText({string={" "..(WAR and localize("war_comeback_bonus") or "Comeback Bonus")}, colours={G.C.UI.TEXT_LIGHT}, shadow=true, pop_in=0, scale=0.4*scale, silent=true})}})'''
times        = 1

# Pre-initialise the War profile ("W") with all_unlocked=true before game.lua
# calls load_profile for the first time.  This mirrors the Cryptid approach:
# the profile table exists and is flagged before any load, so if vanilla's
# load_profile ever honours all_unlocked the manual sweep becomes a no-op.
# The manual _unlock_sweep in enter_war_profile stays as the safety net.
[[patches]]
[patches.pattern]
target       = "game.lua"
pattern      = 'self:load_profile(G.SETTINGS.profile or 1)'
position     = "before"
match_indent = true
payload      = '''if G.PROFILES then G.PROFILES["W"] = G.PROFILES["W"] or { all_unlocked = true } end
-- If the game exited mid-match (crash/force-quit), G.SETTINGS.profile may
-- still be "W".  Reset it to profile 1 so create_tabs doesn't crash when
-- profile_select finds no chosen tab (G.focused_profile == "W" != 1/2/3).
if G.SETTINGS and G.SETTINGS.profile == "W" then G.SETTINGS.profile = 1 end'''
times        = 1

# The pause menu prints the run seed in seeded runs. A War match is always
# seeded (the relay dictates it), so showing it hands the opponent a fully
# deterministic replay — hide the row for the length of the match.
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = "G.GAME.seeded and current_seed or nil,"
position     = "at"
match_indent = true
payload      = "(G.GAME.seeded and not (WAR and WAR.GAME and WAR.GAME.active)) and current_seed or nil,"
times        = 1

# Hide the "Start New Run" button in the pause menu during a War match.
# Restarting mid-match would desync or dodge a loss; the button is simply absent.
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = "restart = UIBox_button{id = 'restart_button', label = {localize('b_start_new_run')}, button = \"setup_run\", minw = 5}"
position     = "at"
match_indent = true
payload      = "restart = not (WAR and WAR.GAME and WAR.GAME.active) and UIBox_button{id = 'restart_button', label = {localize('b_start_new_run')}, button = \"setup_run\", minw = 5} or nil"
times        = 1

# A live match cannot be "left" without telling the other player, so the pause
# menu's Main Menu is a forfeit while one is running (core/game_hooks.lua sends
# the forfeit to the relay before the menu transition).
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = '''main_menu = UIBox_button{ label = {localize('b_main_menu')}, button = "go_to_menu", minw = 5}'''
position     = "at"
match_indent = true
payload      = '''main_menu = UIBox_button{ label = {localize((WAR and WAR.GAME and WAR.GAME.active) and 'war_forfeit' or 'b_main_menu')}, button = "go_to_menu", minw = 5}'''
times        = 1

# When a deck starts with a specific consumable (e.g. Ghost Deck → c_hex) and
# that consumable is banned, create_card falls back to the _type argument which
# vanilla hard-codes as 'Tarot'. Instead use the actual set of the banned card
# so Ghost Deck gives a random Spectral (not Tarot) when Hex is banned.
[[patches]]
[patches.pattern]
target       = "back.lua"
pattern      = "local card = create_card('Tarot', G.consumeables, nil, nil, nil, nil, v, 'deck')"
position     = "at"
match_indent = true
payload      = "local card = create_card((G.P_CENTERS[v] and G.GAME and G.GAME.banned_keys and G.GAME.banned_keys[v]) and G.P_CENTERS[v].set or 'Tarot', G.consumeables, nil, nil, nil, nil, v, 'deck')"
times        = 1

# The round-counter number box turns orange during a War blind timer and
# becomes a pause/resume button for the waiting player.
# Adding button = 'war_timer_toggle' here at load time means set_values()
# properly arms collide.can/click.can — war_timer_toggle no-ops when no
# timer is running so it is safe to leave it on permanently.
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = "{n=G.UIT.R, config={align = \"cm\", r = 0.1, minw = 1.2, colour = temp_col2, id = 'row_round_text'}, nodes={"
position     = "at"
match_indent = true
payload      = "{n=G.UIT.R, config={align = \"cm\", r = 0.1, minw = 1.2, colour = temp_col2, id = 'row_round_text', button = 'war_timer_toggle'}, nodes={"
times        = 1

# NOTE: the original lovely patch for tag-collection debuffing (which targeted
# "local temp_tag_ui, temp_tag_sprite = temp_tag:generate_UI()" in
# UI_definitions.lua) has been removed.  SMODS completely replaces
# create_UIBox_your_collection_tags at runtime, so that call site is never
# reached and the patch is dead.  The equivalent logic now lives in
# core/game_hooks.lua as a Tag:generate_UI wrap that fires regardless of which
# collection function renders the tags.

# banned_keys only culls the pools, so anything that hands out a tag by name
# (Diet Cola and Anaglyph Deck hard-code Double Tag; a modded card can name any
# key) still gets a working tag. Every tag spawn goes through add_tag, so one
# call in there covers vanilla's own spawns and every mod's.
[[patches]]
[patches.pattern]
target       = "functions/UI_definitions.lua"
pattern      = "function add_tag(_tag)"
position     = "after"
match_indent = true
payload      = "if WAR and WAR.filter_tag then _tag = WAR.filter_tag(_tag) end"
times        = 1
